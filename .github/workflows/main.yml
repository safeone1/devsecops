name: CI

on: 
  push: 
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Install Dep
        run: bun install

      - name: lint
        run: bun run lint

      - name: Run Tests
        run: bun test

      - name: Build
        run: bun run build
